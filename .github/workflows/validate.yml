name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n config/*.sh scripts/*.sh
      - name: Check Python syntax
        run: python3 -c 'import ast, pathlib; [ast.parse(p.read_text(encoding="utf-8"), filename=str(p)) for p in pathlib.Path("scripts").glob("*.py")]'
      - name: Check committed TSV structure and summaries
        run: python3 scripts/check_repository.py
